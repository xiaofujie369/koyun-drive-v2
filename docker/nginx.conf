# Koyun Drive v2 — behind a TLS reverse proxy (bundled Caddy or your own).
upstream drive_app {
    server app:9000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /srv/www;

    server_tokens off;
    client_max_body_size 40m;          # one upload chunk (max 32 MB) + headroom
    client_body_buffer_size 1m;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Caddy already resolved the real client IP (CF-Connecting-IP or remote addr).
    set $client_xff $http_x_forwarded_for;
    if ($client_xff = "") { set $client_xff $remote_addr; }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $client_xff;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ---- Laravel: API (/kd/ — Cloudflare blocks /api* on this zone), downloads, health, legacy v1 links
    location /kd/ { proxy_pass http://drive_app; }
    location = /up { proxy_pass http://drive_app; }
    location /d/ { proxy_pass http://drive_app; }
    location /dl/ { proxy_pass http://drive_app; }
    location ~ ^/s/[^/]+/(file|download)(/|$) { proxy_pass http://drive_app; }
    location /public-download/ { proxy_pass http://drive_app; }
    location ~ ^/folder/\d+/?$ { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location /folder/ { proxy_pass http://drive_app; }   # v1 /folder/<name>

    # ---- File bytes, only reachable through X-Accel-Redirect from Laravel
    location /_protected_files/ {
        internal;
        alias /data/files/;
        # Content-Type / Content-Disposition / Cache-Control come from Laravel.
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox";
    }

    # ---- Single-page apps
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /admin/assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /admin { try_files $uri /admin/index.html; add_header Cache-Control "no-cache"; add_header X-Frame-Options DENY; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; add_header X-Frame-Options DENY; }
}
